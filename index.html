<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MBA Portfolio — Rohan Stanly Keecheril</title>
  <!-- AutoForge Fonts: Space Grotesk, Inter, and Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* AutoForge Palette */
      --brand-500: #F25C05;
      --brand-600: #ea580c;
      --brand-light: #ffedd5;
      --brand-dim: rgba(242, 92, 5, 0.15);
      --white: #F8FAFC;
      --off-white: #E2E8F0;
      --muted: #94A3B8;
      --border: rgba(242, 92, 5, 0.25);
      --dark: #0B0F17;
      --dark-card: #111827;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--dark);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ── Canvas bg ── */
    canvas#bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* ── Noise grain overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
    }

    /* ── Decorative lines ── */
    .line-top {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: min(80vw, 600px);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--brand-500), transparent);
      z-index: 2;
      opacity: 0;
      animation: fadeReveal 2s ease 0.5s forwards;
    }

    .line-bottom {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: min(80vw, 600px);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--brand-500), transparent);
      z-index: 2;
      opacity: 0;
      animation: fadeReveal 2s ease 0.8s forwards;
    }

    /* ── Corner marks ── */
    .corner {
      position: fixed;
      width: 20px;
      height: 20px;
      z-index: 2;
      opacity: 0;
      animation: fadeReveal 2s ease 1s forwards;
    }
    .corner--tl { top: 28px; left: 28px; border-top: 1px solid var(--brand-500); border-left: 1px solid var(--brand-500); }
    .corner--tr { top: 28px; right: 28px; border-top: 1px solid var(--brand-500); border-right: 1px solid var(--brand-500); }
    .corner--bl { bottom: 28px; left: 28px; border-bottom: 1px solid var(--brand-500); border-left: 1px solid var(--brand-500); }
    .corner--br { bottom: 28px; right: 28px; border-bottom: 1px solid var(--brand-500); border-right: 1px solid var(--brand-500); }

    /* ── Main layout ── */
    main {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 60px 30px;
      gap: 0;
      opacity: 0;
      animation: fadeReveal 1.8s ease 0.3s forwards;
    }

    .eyebrow {
      font-family: 'Fira Code', monospace;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--brand-500);
      margin-bottom: 24px;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: '//';
      margin: 0 10px;
      opacity: 0.6;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.8rem, 7vw, 5rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.03em;
      color: var(--white);
      margin-bottom: 14px;
    }

    h1 em {
      font-style: normal;
      color: var(--brand-500);
      background: linear-gradient(135deg, #F25C05, #ea580c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-family: 'Inter', sans-serif;
      font-size: clamp(0.95rem, 2vw, 1.15rem);
      font-weight: 300;
      color: var(--muted);
      margin-bottom: 40px;
      letter-spacing: 0.01em;
      max-width: 520px;
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 48px;
      width: 200px;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--brand-500));
    }
    .divider::after {
      background: linear-gradient(90deg, var(--brand-500), transparent);
    }
    .divider-diamond {
      width: 6px;
      height: 6px;
      background: var(--brand-500);
      transform: rotate(45deg);
      flex-shrink: 0;
      box-shadow: 0 0 8px rgba(242, 92, 5, 0.6);
    }

    /* ── Buttons ── */
    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
    }

    a.button {
      text-decoration: none;
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 32px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--white);
      border: 1px solid rgba(242, 92, 5, 0.3);
      background: rgba(17, 24, 39, 0.6);
      backdrop-blur: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      overflow: hidden;
      border-radius: 9999px;
    }

    a.button::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--brand-dim), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    a.button:hover {
      color: #fff;
      border-color: var(--brand-500);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(242, 92, 5, 0.25);
    }

    a.button:hover::before { opacity: 1; }

    a.button svg {
      width: 14px;
      height: 14px;
      opacity: 0.8;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    a.button:hover svg {
      opacity: 1;
      transform: translateX(3px);
    }

    a.button.primary {
      background: linear-gradient(135deg, #F25C05, #c2410c);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 14px rgba(242, 92, 5, 0.35);
    }

    a.button.primary:hover {
      background: linear-gradient(135deg, #ea580c, #9a3412);
      box-shadow: 0 6px 24px rgba(242, 92, 5, 0.5);
    }

    /* ── Footer ── */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      opacity: 0;
      animation: fadeReveal 2s ease 1.2s forwards;
    }

    .footer-label {
      font-family: 'Fira Code', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(148, 163, 184, 0.5);
    }

    footer a {
      color: rgba(148, 163, 184, 0.6);
      text-decoration: none;
      font-family: 'Fira Code', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: color 0.3s ease;
    }

    footer a:hover { color: var(--brand-500); }

    @keyframes fadeReveal {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>

  <!-- Decorative frame -->
  <div class="line-top"></div>
  <div class="line-bottom"></div>
  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>

  <main>
    <p class="eyebrow">MBA Academic Portfolio</p>

    <h1>Academic<br><em>Work &amp; Research</em></h1>

    <p class="subtitle">A curated archive of operations research, case studies &amp; predictive analytics</p>

    <div class="divider"><span class="divider-diamond"></span></div>

    <div class="buttons">
      <a href="assignments.html" class="button primary">
        View Assignments
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
      <a href="about.html" class="button">
        About Me
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/>
        </svg>
      </a>
    </div>
  </main>

  <footer>
    <span class="footer-label">© 2026 AutoForge Suite</span>
    <a href="https://github.com/YOURUSERNAME">GitHub ↗</a>
  </footer>

  <script>
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');

    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      initParticles();
    });

    // AutoForge Brand Color Palette in Canvas
    const BRAND_ORANGE = 'rgba(242, 92, 5,';
    const SLATE_WHITE = 'rgba(248, 250, 252,';
    const NUM = 85;
    let particles = [];
    let mouse = { x: W / 2, y: H / 2 };

    window.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    class P {
      constructor() { this.reset(true); }
      reset(init) {
        this.x = Math.random() * W;
        this.y = init ? Math.random() * H : (Math.random() > 0.5 ? -4 : H + 4);
        this.size = Math.random() * 1.3 + 0.3;
        this.vx = (Math.random() - 0.5) * 0.24;
        this.vy = (Math.random() - 0.5) * 0.24;
        this.isBrand = Math.random() > 0.65;
        this.alpha = Math.random() * 0.55 + 0.2;
        this.pulse = Math.random() * Math.PI * 2;
      }
      update() {
        this.pulse += 0.015;
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 160) {
          this.vx -= dx / dist * 0.012;
          this.vy -= dy / dist * 0.012;
        }
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.995;
        this.vy *= 0.995;
        if (this.x < -10 || this.x > W + 10 || this.y < -10 || this.y > H + 10) this.reset(false);
      }
      draw() {
        const a = this.alpha * (0.7 + 0.3 * Math.sin(this.pulse));
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.isBrand ? BRAND_ORANGE + a + ')' : SLATE_WHITE + (a * 0.7) + ')';
        ctx.fill();
      }
    }

    function initParticles() {
      particles = [];
      for (let i = 0; i < NUM; i++) particles.push(new P());
    }

    function drawConnections() {
      for (let a = 0; a < particles.length; a++) {
        for (let b = a + 1; b < particles.length; b++) {
          const dx = particles[a].x - particles[b].x;
          const dy = particles[a].y - particles[b].y;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d < 115) {
            const opacity = (1 - d / 115) * 0.08;
            ctx.strokeStyle = BRAND_ORANGE + opacity + ')';
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(particles[a].x, particles[a].y);
            ctx.lineTo(particles[b].x, particles[b].y);
            ctx.stroke();
          }
        }
      }
    }

    function drawRadialGlow() {
      const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.55);
      grad.addColorStop(0, 'rgba(242, 92, 5, 0.05)');
      grad.addColorStop(0.5, 'rgba(242, 92, 5, 0.015)');
      grad.addColorStop(1, 'rgba(11, 15, 23, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
    }

    function animate() {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#0B0F17'; // Matches AutoForge Dark 900
      ctx.fillRect(0, 0, W, H);
      drawRadialGlow();
      particles.forEach(p => { p.update(); p.draw(); });
      drawConnections();
      requestAnimationFrame(animate);
    }

    initParticles();
    animate();
  </script>
</body>
</html>
